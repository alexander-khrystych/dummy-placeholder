$schema: https://json-schema.org/draft/2019-09/schema
title: POST /auth/login - 200
description: 200 response schema to POST /auth/login
type: object
properties:
  accessToken:
    type: string
  refreshToken:
    type: string
  id:
    type: integer
  username:
    type: string
  email:
    type: string
    format: email
  firstName:
    type: string
  lastName:
    type: string
  gender:
    type: string
  image:
    type: string
    format: uri
additionalProperties: false
required:
  - accessToken
  - refreshToken
  - id
  - username
  - email
  - firstName
  - lastName
  - gender
  - image